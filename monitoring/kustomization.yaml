apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - namespace.yaml
  - prometheusrule.yaml
configMapGenerator:
  - name: sample-app-dashboard
    files:
      - sample-app.json=dashboards/sample-app.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
