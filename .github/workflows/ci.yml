name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.6

      - name: Format
        run: terraform fmt -check -recursive

      - name: Init and validate
        working-directory: terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.64.0

      - name: TFLint
        working-directory: terraform
        run: |
          tflint --init
          tflint --recursive

  manifests:
    name: Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: yamllint
        run: |
          python -m pip install --disable-pip-version-check yamllint==1.35.1
          yamllint -c .yamllint.yaml .

      - name: Install kubeconform
        run: |
          curl -sSL -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          sudo tar -C /usr/local/bin -xzf /tmp/kubeconform.tar.gz kubeconform
          kubeconform -v

      - name: Install kustomize
        run: |
          curl -sSL -o /tmp/kustomize.tar.gz \
            https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.3/kustomize_v5.8.3_linux_amd64.tar.gz
          sudo tar -C /usr/local/bin -xzf /tmp/kustomize.tar.gz kustomize
          kustomize version

      - name: kubeconform
        run: |
          crds='https://raw.githubusercontent.com/datreeio/CRDs-catalog/main'
          crds="${crds}/{{ .Group }}/{{ .ResourceKind }}_{{ .ResourceAPIVersion }}.json"
          args=(
            -strict
            -summary
            -kubernetes-version 1.33.0
            -schema-location default
            -schema-location "$crds"
          )
          kustomize build manifests/sample-app | kubeconform "${args[@]}"
          kustomize build monitoring | kubeconform "${args[@]}"
