apiVersion: v1
kind: ServiceAccount
metadata:
  name: sample-app
  namespace: sample-app
  labels:
    app.kubernetes.io/name: sample-app
    app.kubernetes.io/part-of: gke-production-blueprint
  annotations:
    # Matches terraform.tfvars.example (name_prefix=gke-bp, project_id=example-project-id).
    # Replace with `terraform output -raw sample_app_gsa_email` when those values change.
    iam.gke.io/gcp-service-account: gke-bp-sample@example-project-id.iam.gserviceaccount.com
automountServiceAccountToken: false
