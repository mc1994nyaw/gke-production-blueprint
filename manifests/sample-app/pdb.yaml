apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sample-app
  namespace: sample-app
  labels:
    app.kubernetes.io/name: sample-app
    app.kubernetes.io/part-of: gke-production-blueprint
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sample-app
